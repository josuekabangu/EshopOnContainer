apiVersion: v1
kind: Namespace
metadata:
  name: network-test
---
apiVersion: v1
kind: Pod
metadata:
  name: network-test-worker
  namespace: network-test
  labels:
    app: network-test
spec:
  nodeSelector:
    kubernetes.io/hostname: kube-worker
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: network-test-control
  namespace: network-test
spec:
  nodeSelector:
    kubernetes.io/hostname: kube-control
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: network-test-service
  namespace: network-test
spec:
  type: ClusterIP
  selector:
    app: network-test
  ports:
    - port: 80
      targetPort: 80
