apiVersion: v1
kind: Namespace
metadata:
  name: gw-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gw-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gw-test
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test
  namespace: gw-test
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: gw-test
spec:
  parentRefs:
    - name: test
  hostnames:
    - whoami.test.lab
  rules:
    - backendRefs:
        - name: whoami
          port: 80
