---
kubernetes_release: "v{{ kubernetes_version.split('-')[0] }}"
api_server_port: 6443
pod_subnet: "10.244.0.0/16"
service_subnet: "10.96.0.0/12"
cluster_dns_domain: "cluster.local"

calico_version: "v3.30.3"
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
calico_manifest_path: "/etc/kubernetes/calico-{{ calico_version }}.yaml"

local_path_version: "v0.0.37"
local_path_manifest_url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml"
local_path_manifest_path: "/etc/kubernetes/local-path-storage-{{ local_path_version }}.yaml"

sealed_secrets_version: "v0.40.0"
sealed_secrets_manifest_url: "https://github.com/bitnami/sealed-secrets/releases/download/{{ sealed_secrets_version }}/controller.yaml"
sealed_secrets_manifest_path: "/etc/kubernetes/sealed-secrets-{{ sealed_secrets_version }}.yaml"
# Sauvegarde de la clé privée, sur le poste de contrôle (WSL2), hors du dépôt
sealed_secrets_backup_dir: "{{ lookup('env', 'HOME') }}/.config/eshoponcontainer/sealed-secrets"

metallb_version: "v0.16.0"
metallb_manifest_url: "https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml"
metallb_manifest_path: "/etc/kubernetes/metallb-{{ metallb_version }}.yaml"
metallb_config_path: "/etc/kubernetes/metallb-config.yaml"
# Adresses attribuées aux Services de type LoadBalancer, sur le réseau privé du laboratoire
metallb_address_range: "192.168.57.20-192.168.57.29"
metallb_interface: "eth1"


envoy_gateway_version: "v1.9.2"
envoy_gateway_manifest_url: "https://github.com/envoyproxy/gateway/releases/download/{{ envoy_gateway_version }}/install.yaml"
envoy_gateway_manifest_path: "/etc/kubernetes/envoy-gateway-{{ envoy_gateway_version }}.yaml"
envoy_gateway_class_path: "/etc/kubernetes/envoy-gateway-class.yaml"


# Noms de l'application résolus par CoreDNS vers le point d'entrée, comme le fichier hosts de Windows
lab_dns_names:
  - shop.eshop.lab
  - identity.eshop.lab
  - webhooks.eshop.lab
lab_dns_target: "eshop-gateway.envoy-gateway-system.svc.{{ cluster_dns_domain }}"
lab_dns_config_path: "/etc/kubernetes/coredns-configmap.yaml"


# Outils du poste de contrôle (WSL2), installés dans ~/.local/bin
workstation_bin_dir: "{{ lookup('env', 'HOME') }}/.local/bin"
workstation_tmp_dir: "{{ lookup('env', 'HOME') }}/.cache/eshoponcontainer"
helm_version: "v4.3.1"
helm_archive_url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
kubeseal_archive_url: "https://github.com/bitnami/sealed-secrets/releases/download/{{ sealed_secrets_version }}/kubeseal-{{ sealed_secrets_version | regex_replace('^v', '') }}-linux-amd64.tar.gz"
kubeseal_checksums_url: "https://github.com/bitnami/sealed-secrets/releases/download/{{ sealed_secrets_version }}/sealed-secrets_{{ sealed_secrets_version | regex_replace('^v', '') }}_checksums.txt"
# Accès administrateur au cluster, recopié à chaque passage : il change à chaque reconstruction
workstation_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"

argocd_version: "v3.5.6"
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
argocd_manifest_path: "/etc/kubernetes/argocd-{{ argocd_version }}.yaml"
argocd_namespace: "argocd"
# Adresse de l'interface d'Argo CD, prise dans la plage de MetalLB ; 192.168.57.20 est celle d'eShop
argocd_server_address: "192.168.57.21"
