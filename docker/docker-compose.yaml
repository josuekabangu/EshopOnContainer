services:
  # =====================================================================
  # POSTGRES PGVECTOR
  # =====================================================================
  postgres:
    image: ankane/pgvector:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata 
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - eshop-network


  # =====================================================================
  # REDIS
  # =====================================================================
  redis:
    image: redis:7
    container_name: redis
    command: 
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 1gb
      - --maxmemory-policy noeviction
      - --appendonly yes
      - --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - eshop-network


  # =====================================================================
  # RABBITMQ
  # =====================================================================
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - eshop-network 

  # =====================================================================
  # IDENTITY.API
  # =====================================================================
  identity-api:
    image: identity-api
    pull_policy: build 
    build:
      context: ..
      dockerfile: docker/src/Identity.API/Dockerfile
    container_name: identity-api
    environment:
      ConnectionStrings__identitydb: "Host=postgres;Port=5432;Database=identitydb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5223:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eshop-network
  
  # =====================================================================
  # CATALOG.API
  # =====================================================================
  catalog-api:
    image: catalog-api
    pull_policy: build
    build: 
      context: ..
      dockerfile: docker/src/Catalog.API/Dockerfile 
    container_name: catalog-api
    environment:
      ConnectionStrings__catalogdb: "Host=postgres;Port=5432;Database=catalogdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__eventbus: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
    ports:
      - "127.0.0.1:5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eshop-network


volumes:
  pg_data:
  redis_data:
  rmq_data:

networks:
  eshop-network:
    driver: bridge
