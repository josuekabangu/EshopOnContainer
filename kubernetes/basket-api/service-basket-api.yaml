apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: eshop
  labels:
    app: basket-api
spec:
  selector:
    app: basket-api
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      # HTTP/2 sans chiffrement : indication pour un futur point d'entrée
      appProtocol: kubernetes.io/h2c
