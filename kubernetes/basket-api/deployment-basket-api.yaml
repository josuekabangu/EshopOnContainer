apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: basket-api
          image: ghcr.io/josuekabangu/basket-api:87e28f8
          envFrom:
            - secretRef:
                name: basket-api-secrets
          env:
            - name: Identity__Url
              value: http://identity-api:5223
            # Routes /health et /alive, hors environnement Development (adaptation ae2f77b)
            - name: HealthChecks__Expose
              value: "true"
            # gRPC en HTTP/2 seul sur 8080 ; second port, en HTTP/1.1, réservé aux probes
            - name: Kestrel__Endpoints__grpc__Url
              value: http://+:8080
            - name: Kestrel__Endpoints__grpc__Protocols
              value: Http2
            - name: Kestrel__Endpoints__health__Url
              value: http://+:8081
            - name: Kestrel__Endpoints__health__Protocols
              value: Http1
          ports:
            - name: grpc
              containerPort: 8080
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
