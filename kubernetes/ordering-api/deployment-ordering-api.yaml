apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordering-api
  template:
    metadata:
      labels:
        app: ordering-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # Équivalent de depends_on : le bus d'événements d'eShop abandonne si RabbitMQ n'est pas prêt
        - name: wait-for-rabbitmq
          image: busybox:1.36.1
          command: ["sh", "-c", "until nc -z -w 2 rabbitmq 5672; do echo 'RabbitMQ pas encore prêt'; sleep 2; done"]
      containers:
        - name: ordering-api
          image: ghcr.io/josuekabangu/ordering-api:87e28f8
          envFrom:
            - secretRef:
                name: ordering-api-secrets
          env:
            - name: Identity__Url
              value: http://identity.eshop.lab
            # Routes /health et /alive, hors environnement Development (adaptation ae2f77b)
            - name: HealthChecks__Expose
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
