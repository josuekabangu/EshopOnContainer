apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: payment-processor
          image: ghcr.io/josuekabangu/payment-processor:87e28f8
          envFrom:
            - secretRef:
                name: payment-processor-secrets
          env:
            # Routes /health et /alive, hors environnement Development (adaptation ae2f77b)
            - name: HealthChecks__Expose
              value: "true"
          ports:
            # Sert seulement aux probes : aucun Service ne l'expose
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
