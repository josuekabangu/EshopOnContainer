apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhooks-api
  template:
    metadata:
      labels:
        app: webhooks-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: webhooks-api
          image: ghcr.io/josuekabangu/webhooks-api:87e28f8
          envFrom:
            - secretRef:
                name: webhooks-api-secrets
          env:
            - name: Identity__Url
              value: http://identity-api:5223
            # Routes /health et /alive, hors environnement Development (adaptation ae2f77b)
            - name: HealthChecks__Expose
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
