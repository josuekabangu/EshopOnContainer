{{- if .Values.encryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # Le nom fait partie du chiffrement : il doit rester <service>-secrets
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eshop-service.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Release.Name }}-secrets
      namespace: {{ .Release.Namespace }}
{{- end }}
