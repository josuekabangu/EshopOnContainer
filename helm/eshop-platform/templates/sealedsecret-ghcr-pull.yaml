apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # Le nom fait partie du chiffrement, et figure dans imagePullSecrets de chaque service
  name: ghcr-pull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eshop-platform.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- required "ghcrPull.encryptedData est obligatoire (helm/values/eshop-platform.yaml)" .Values.ghcrPull.encryptedData | toYaml | nindent 4 }}
  template:
    metadata:
      name: ghcr-pull
      namespace: {{ .Release.Namespace }}
    # Identifiants de registre : sans ce type, le cluster ne s'en servirait pas pour télécharger les images
    type: kubernetes.io/dockerconfigjson
