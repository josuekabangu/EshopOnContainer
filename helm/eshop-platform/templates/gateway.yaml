apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # Les routes des services s'y rattachent par ce nom (parentRefs)
  name: eshop
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eshop-platform.labels" . | nindent 4 }}
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eshop
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
