# Construit et publie les images des neuf services d'eShop sur ghcr.io, étiquetées par le commit.
name: Images

on:
  push:
    branches: [main]
    paths:
      - application/**
      - docker/src/**
      - .dockerignore
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Un service en échec n'arrête pas les autres
      fail-fast: false
      matrix:
        include:
          - service: identity-api
            dockerfile: docker/src/Identity.API/Dockerfile
          - service: catalog-api
            dockerfile: docker/src/Catalog.API/Dockerfile
          - service: basket-api
            dockerfile: docker/src/Basket.API/Dockerfile
          - service: ordering-api
            dockerfile: docker/src/Ordering.API/Dockerfile
          - service: order-processor
            dockerfile: docker/src/OrderProcessor/Dockerfile
          - service: payment-processor
            dockerfile: docker/src/PaymentProcessor/Dockerfile
          - service: webhooks-api
            dockerfile: docker/src/Webhooks.API/Dockerfile
          - service: webapp
            dockerfile: docker/src/WebApp/Dockerfile
          - service: webhook-client
            dockerfile: docker/src/WebhookClient/Dockerfile

    steps:
      # Actions désignées par l'empreinte de leur commit : une étiquette de version peut être déplacée
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Calculer l'étiquette de l'image
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Contexte : la racine du dépôt, comme en local (docs/02-docker/01-catalog-api.md)
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache des couches, propre à chaque service
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
