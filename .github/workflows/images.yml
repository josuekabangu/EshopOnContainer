# Construit et publie les images des neuf services d'eShop sur ghcr.io, étiquetées par le commit.
name: Images

on:
  push:
    branches: [main]
    paths:
      - application/**
      - docker/src/**
      - .dockerignore
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  # Pas de compte rendu de construction joint à chaque exécution
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Un service en échec n'arrête pas les autres
      fail-fast: false
      matrix:
        include:
          - service: identity-api
            dockerfile: docker/src/Identity.API/Dockerfile
          - service: catalog-api
            dockerfile: docker/src/Catalog.API/Dockerfile
          - service: basket-api
            dockerfile: docker/src/Basket.API/Dockerfile
          - service: ordering-api
            dockerfile: docker/src/Ordering.API/Dockerfile
          - service: order-processor
            dockerfile: docker/src/OrderProcessor/Dockerfile
          - service: payment-processor
            dockerfile: docker/src/PaymentProcessor/Dockerfile
          - service: webhooks-api
            dockerfile: docker/src/Webhooks.API/Dockerfile
          - service: webapp
            dockerfile: docker/src/WebApp/Dockerfile
          - service: webhook-client
            dockerfile: docker/src/WebhookClient/Dockerfile

    steps:
      # Actions désignées par l'empreinte de leur commit : une étiquette de version peut être déplacée
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Calculer l'étiquette de l'image
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Contexte : la racine du dépôt, comme en local (docs/02-docker/01-catalog-api.md)
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache des couches, propre à chaque service
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-values:
    name: Étiquettes dans helm/values
    # Seulement si les neuf images ont été publiées
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Écrire la nouvelle étiquette dans les fichiers de valeurs
        run: |
          TAG="${GITHUB_SHA::7}"
          for s in identity-api catalog-api basket-api ordering-api order-processor \
                   payment-processor webhooks-api webapp webhook-client; do
            # Seule l'empreinte est remplacée : le retour chariot des fichiers CRLF est conservé
            sed -i -E "s/^(  tag: )[0-9a-f]+/\1${TAG}/" "helm/values/${s}.yaml"
          done
          git diff --stat

      - name: Commiter et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/values/
          # Rien à commiter si les étiquettes étaient déjà à jour (relance d'une exécution)
          if git diff --cached --quiet; then
            echo "Étiquettes déjà à jour"
          else
            git commit -m "CI : images ${GITHUB_SHA::7} dans helm/values"
            # main a pu avancer pendant la construction : on se replace au-dessus avant de pousser
            git pull --rebase origin main
            git push
          fi
